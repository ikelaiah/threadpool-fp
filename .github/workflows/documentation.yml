name: Publish documentation

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Source ref to publish as the current documentation release
        required: true
        default: main
  release:
    types: [published]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out documentation source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.source_ref }}
          fetch-depth: 0

      - name: Test documentation tooling
        run: |
          python3 tools/test_build_docs.py
          python3 tools/test_build_all_docs.py
          python3 tools/test_check_built_docs.py
          python3 tools/test_check_docs.py
          python3 tools/check_docs.py

      - name: Read documentation release
        id: version
        run: echo "release=$(python3 -c 'import json; print(json.load(open("docs/versions.json"))["current"])')" >> "$GITHUB_OUTPUT"

      - name: Build versioned documentation
        run: |
          python3 tools/build_all_docs.py --site-root site --offline-dir artifacts
          python3 tools/check_built_docs.py --site site

      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
        with:
          enablement: true

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: site

      - name: Upload offline documentation artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: threadpool-fp-docs-${{ steps.version.outputs.release }}
          if-no-files-found: error
          path: |
            artifacts/threadpool-fp-docs-${{ steps.version.outputs.release }}.zip
            artifacts/threadpool-fp-docs-${{ steps.version.outputs.release }}.zip.sha256

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4