name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Lazarus + FPC
        uses: gcarreno/setup-lazarus@v3
        with:
          lazarus-version: stable

      - name: Build package
        run: lazbuild package/lazarus/threadpool_fp.lpk

      - name: Build test runner
        run: lazbuild tests/TestRunner.lpi

      - name: Run tests
        shell: bash
        run: |
          if [ -f tests/TestRunner.exe ]; then
            ./tests/TestRunner.exe -a -p --format=plain
          else
            ./tests/TestRunner -a -p --format=plain
          fi

      - name: Build benchmark
        run: lazbuild --build-mode=Release benchmarks/ThreadPoolBenchmark.lpi

      - name: Run benchmark smoke test
        shell: bash
        run: |
          if [ -f benchmarks/ThreadPoolBenchmark.exe ]; then
            ./benchmarks/ThreadPoolBenchmark.exe
          else
            ./benchmarks/ThreadPoolBenchmark
          fi

      - name: Compile and run documentation examples (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: python3 tools/test_docs_examples.py

      - name: Compile and run documentation examples (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: python tools/test_docs_examples.py

  build-examples:
    name: Build examples (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Lazarus + FPC
        uses: gcarreno/setup-lazarus@v3
        with:
          lazarus-version: stable

      - name: Build all examples
        shell: bash
        run: sh ./build-examples.sh Release

  documentation:
    name: Documentation checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Test documentation tooling
        shell: bash
        run: |
          python3 tools/test_build_docs.py
          python3 tools/test_build_all_docs.py
          python3 tools/test_check_built_docs.py
          python3 tools/test_check_docs.py
          python3 tools/check_docs.py

      - name: Build and validate documentation site
        shell: bash
        run: |
          python3 tools/build_all_docs.py --site-root site --offline-dir artifacts
          python3 tools/check_built_docs.py --site site
